name: Sync LiveOps Story Episodes

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-live-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download CSV and compile JSON
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          python - <<'PY'
          import csv, io, json, os, urllib.request
          from pathlib import Path

          url = os.environ.get("SHEET_CSV_URL", "").strip()
          if not url:
              raise SystemExit(
                  "Missing repository secret SHEET_CSV_URL. Add the published Google Sheets CSV export URL in Settings > Secrets and variables > Actions."
              )
          if not (url.startswith("https://") and ("docs.google.com/spreadsheets/" in url or "googleusercontent.com/" in url)):
              raise SystemExit("SHEET_CSV_URL must be a published Google Sheets CSV export URL over HTTPS.")

          request = urllib.request.Request(url, headers={"User-Agent": "NovaDrift-LiveOps-Sync/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read().decode("utf-8-sig")

          reader = csv.DictReader(io.StringIO(raw))
          if not reader.fieldnames:
              raise SystemExit("The CSV has no header row.")
          rows = []
          for source_row in reader:
              row = {}
              for key, value in source_row.items():
                  if key is None:
                      continue
                  key = key.strip()
                  if not key:
                      continue
                  row[key] = (value or "").strip()
              if any(value != "" for value in row.values()):
                  rows.append(row)

          output = Path("live_episodes.json")
          output.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Compiled {len(rows)} episode rows into {output}.")
          PY

      - name: Commit and push changed JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_episodes.json
          if git diff --cached --quiet; then
            echo "live_episodes.json is already up to date."
            exit 0
          fi
          git commit -m "chore: sync live story episodes"
          git push origin HEAD:main
